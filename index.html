<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Time Zones</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 2rem 1rem;
    color: #333;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
}

.header {
    text-align: center;
    color: white;
    margin-bottom: 3rem;
    animation: fadeIn 0.8s ease-in;
}

.header h1 {
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
}

.header p {
    font-size: 1.1rem;
    opacity: 0.95;
}

.controls {
    display: flex;
    gap: 1rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
    justify-content: center;
}

.search-input {
    flex: 1;
    min-width: 250px;
    max-width: 500px;
    padding: 0.8rem 1rem;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.1);
    color: white;
    font-size: 1rem;
    transition: all 0.3s ease;
}

.search-input::placeholder {
    color: rgba(255, 255, 255, 0.7);
}

.search-input:focus {
    outline: none;
    border-color: #667eea;
    background: rgba(255, 255, 255, 0.2);
    box-shadow: 0 0 15px rgba(102, 126, 234, 0.5);
}

.add-btn {
    padding: 0.8rem 1.5rem;
    background: #667eea;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
}

.add-btn:hover {
    background: #5568d3;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
}

.add-btn:active {
    transform: translateY(0);
}

.clocks-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.5rem;
    margin-bottom: 3rem;
    animation: fadeIn 0.6s ease-in;
}

.clock-card {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    padding: 2rem;
    border: 1px solid rgba(255, 255, 255, 0.18);
    box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
    color: white;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

.clock-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #667eea, #764ba2);
}

.clock-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 40px rgba(31, 38, 135, 0.5);
    border-color: rgba(255, 255, 255, 0.3);
}

.timezone-name {
    font-size: 0.9rem;
    opacity: 0.8;
    margin-bottom: 0.5rem;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.digital-time {
    font-size: 2.5rem;
    font-weight: bold;
    font-family: 'Courier New', monospace;
    margin-bottom: 0.5rem;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    letter-spacing: 2px;
}

.time-details {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    font-size: 0.85rem;
    opacity: 0.85;
}

.date-display {
    flex: 1;
}

.remove-btn {
    background: rgba(231, 76, 60, 0.3);
    border: 1px solid rgba(231, 76, 60, 0.5);
    color: #ff6b6b;
    padding: 0.4rem 0.8rem;
    border-radius: 5px;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: bold;
    transition: all 0.3s ease;
}

.remove-btn:hover {
    background: rgba(231, 76, 60, 0.6);
    border-color: rgba(231, 76, 60, 0.8);
    transform: scale(1.05);
}

.empty-state {
    text-align: center;
    padding: 3rem;
    color: white;
    opacity: 0.8;
}

.empty-state-icon {
    font-size: 3rem;
    margin-bottom: 1rem;
}

.popular-timezones {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    padding: 2rem;
    border: 1px solid rgba(255, 255, 255, 0.18);
    box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
}

.popular-timezones h2 {
    color: white;
    margin-bottom: 1.5rem;
    font-size: 1.3rem;
}

.timezone-buttons {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 0.8rem;
}

.tz-btn {
    padding: 0.6rem 1rem;
    background: rgba(102, 126, 234, 0.2);
    border: 2px solid #667eea;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    transition: all 0.3s ease;
}

.tz-btn:hover {
    background: #667eea;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
}

.tz-btn:active {
    transform: translateY(0);
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 768px) {
    .header h1 {
        font-size: 1.8rem;
    }

    .digital-time {
        font-size: 2rem;
    }

    .controls {
        flex-direction: column;
    }

    .search-input {
        max-width: 100%;
    }

    .clocks-container {
        grid-template-columns: 1fr;
    }

    .timezone-buttons {
        grid-template-columns: repeat(2, 1fr);
    }
}
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🕐 Global Time Zone Clock</h1>
            <p>Real-time clock displaying current time across different time zones</p>
        </header>

        <div class="controls">
            <input 
                type="text" 
                id="searchInput" 
                class="search-input" 
                placeholder="Search or add timezone (e.g., America/New_York)"
            >
            <button id="addBtn" class="add-btn">+ Add Timezone</button>
        </div>

        <div class="clocks-container" id="clocksContainer">
            <!-- Clocks will be dynamically inserted here -->
        </div>

        <div class="popular-timezones">
            <h2>Popular Time Zones</h2>
            <div class="timezone-buttons">
                <button class="tz-btn" data-tz="America/New_York">New York (EST)</button>
                <button class="tz-btn" data-tz="Europe/London">London (GMT)</button>
                <button class="tz-btn" data-tz="Europe/Paris">Paris (CET)</button>
                <button class="tz-btn" data-tz="Asia/Tokyo">Tokyo (JST)</button>
                <button class="tz-btn" data-tz="Asia/Shanghai">Shanghai (CST)</button>
                <button class="tz-btn" data-tz="Australia/Sydney">Sydney (AEDT)</button>
                <button class="tz-btn" data-tz="Asia/Dubai">Dubai (GST)</button>
                <button class="tz-btn" data-tz="Asia/Kolkata">India (IST)</button>
            </div>
        </div>
    </div>

    <script>
// List of all available time zones
const allTimezones = [
    'America/New_York', 'America/Chicago', 'America/Denver', 'America/Los_Angeles',
    'America/Anchorage', 'Pacific/Honolulu', 'America/Toronto', 'America/Mexico_City',
    'America/Buenos_Aires', 'America/Sao_Paulo', 'Europe/London', 'Europe/Paris',
    'Europe/Berlin', 'Europe/Moscow', 'Europe/Istanbul', 'Africa/Cairo', 'Africa/Lagos',
    'Africa/Johannesburg', 'Asia/Dubai', 'Asia/Kolkata', 'Asia/Bangkok', 'Asia/Hong_Kong',
    'Asia/Shanghai', 'Asia/Tokyo', 'Australia/Sydney', 'Australia/Melbourne',
    'Pacific/Auckland', 'Pacific/Fiji', 'Pacific/Tongatapu'
];

// Store selected time zones in localStorage
let selectedTimezones = JSON.parse(localStorage.getItem('selectedTimezones')) || ['UTC', 'America/New_York', 'Europe/London', 'Asia/Tokyo'];

// Initialize the app
function init() {
    renderClocks();
    updateClocks();
    setInterval(updateClocks, 1000);
    setupEventListeners();
}

// Set up event listeners
function setupEventListeners() {
    const addBtn = document.getElementById('addBtn');
    const searchInput = document.getElementById('searchInput');
    const tzButtons = document.querySelectorAll('.tz-btn');

    addBtn.addEventListener('click', addTimezoneFromInput);
    searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') addTimezoneFromInput();
    });

    tzButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            const tz = btn.getAttribute('data-tz');
            addTimezone(tz);
        });
    });
}

// Add timezone from input
function addTimezoneFromInput() {
    const input = document.getElementById('searchInput');
    const tz = input.value.trim();

    if (!tz) {
        alert('Please enter a timezone');
        return;
    }

    if (addTimezone(tz)) {
        input.value = '';
    }
}

// Add timezone to the list
function addTimezone(tz) {
    // Validate timezone
    try {
        new Date().toLocaleString('en-US', { timeZone: tz });
    } catch (e) {
        alert(`Invalid timezone: ${tz}`);
        return false;
    }

    // Check if already added
    if (selectedTimezones.includes(tz)) {
        alert('This timezone is already added');
        return false;
    }

    // Add timezone
    selectedTimezones.push(tz);
    localStorage.setItem('selectedTimezones', JSON.stringify(selectedTimezones));
    renderClocks();
    return true;
}

// Remove timezone
function removeTimezone(tz) {
    selectedTimezones = selectedTimezones.filter(t => t !== tz);
    localStorage.setItem('selectedTimezones', JSON.stringify(selectedTimezones));
    renderClocks();
}

// Render all clocks
function renderClocks() {
    const container = document.getElementById('clocksContainer');
    container.innerHTML = '';

    if (selectedTimezones.length === 0) {
        container.innerHTML = `
            <div class="empty-state" style="grid-column: 1/-1;">
                <div class="empty-state-icon">🕐</div>
                <h3>No timezones selected</h3>
                <p>Add a timezone to get started!</p>
            </div>
        `;
        return;
    }

    selectedTimezones.forEach(tz => {
        const clockCard = createClockCard(tz);
        container.appendChild(clockCard);
    });
}

// Create a clock card element
function createClockCard(tz) {
    const card = document.createElement('div');
    card.className = 'clock-card';
    card.id = `clock-${tz}`;

    const timezoneName = tz === 'UTC' ? 'UTC' : tz.split('/')[1].replace(/_/g, ' ');
    const regionName = tz === 'UTC' ? 'Coordinated Universal Time' : tz.split('/')[0];

    card.innerHTML = `
        <div class="timezone-name">${regionName}</div>
        <div class="digital-time" id="time-${tz}">00:00:00</div>
        <div class="time-details">
            <div class="date-display" id="date-${tz}">Loading...</div>
            <button class="remove-btn" onclick="removeTimezone('${tz}')">Remove</button>
        </div>
    `;

    return card;
}

// Update all clocks
function updateClocks() {
    selectedTimezones.forEach(tz => {
        updateClock(tz);
    });
}

// Update a single clock
function updateClock(tz) {
    const timeElement = document.getElementById(`time-${tz}`);
    const dateElement = document.getElementById(`date-${tz}`);

    if (!timeElement || !dateElement) return;

    const now = new Date();
    const timeString = now.toLocaleString('en-US', {
        timeZone: tz,
        hour12: false,
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
    });

    const dateString = now.toLocaleDateString('en-US', {
        timeZone: tz,
        weekday: 'short',
        month: 'short',
        day: 'numeric'
    });

    timeElement.textContent = timeString;
    dateElement.textContent = dateString;
}

// Initialize on page load
document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
